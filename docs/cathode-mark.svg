<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#06070A" />
    </linearGradient>

    <!-- Arc Primary Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#2979FF" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#22283A" stroke-width="3" />

  <!-- CRT Tube Lens Background -->
  <circle cx="256" cy="256" r="182" fill="#07090E" stroke="#182238" stroke-width="2" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="#2979FF" stroke-width="1" opacity="0.25" />

  <!-- Horizontal Beam Scanline -->
  <line x1="74" y1="256" x2="438" y2="256" stroke="url(#lineGrad)" stroke-width="2.5" opacity="0.85" filter="url(#glow)" />

  <!-- Outer Glow Arc -->
  <path d="M 351.5 160.5 A 135 135 0 1 0 351.5 351.5"
        fill="none"
        stroke="#2979FF"
        stroke-width="34"
        stroke-linecap="round"
        opacity="0.35"
        filter="url(#subtleGlow)" />

  <!-- Primary Arc (Neon Cyan to Electric Blue) -->
  <path d="M 351.5 160.5 A 135 135 0 1 0 351.5 351.5"
        fill="none"
        stroke="url(#arcGrad)"
        stroke-width="24"
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Inner High-Voltage White Core -->
  <path d="M 351.5 160.5 A 135 135 0 1 0 351.5 351.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.95" />

  <!-- Center Reticle Electron Dot Halo -->
  <circle cx="256" cy="256" r="22" fill="#00E5FF" opacity="0.2" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#07090E" stroke="#00E5FF" stroke-width="3.5" filter="url(#glow)" />
  <circle cx="256" cy="256" r="5" fill="#FFFFFF" />
</svg>
