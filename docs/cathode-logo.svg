<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#090B10"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <linearGradient id="ringB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#00BAF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="beamB" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#00BAF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00BAF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Solid Widescreen Background -->
  <rect width="640" height="360" fill="url(#bgB)"/>

  <!-- Left Icon Group -->
  <g transform="translate(140, 180)">
    <circle cx="0" cy="0" r="110" fill="#00BAF8" opacity="0.08"/>
    <rect x="-110" y="-2" width="220" height="4" rx="2" fill="url(#beamB)"/>
    <rect x="-60" y="-1.5" width="120" height="3" rx="1.5" fill="#FFFFFF" opacity="0.95"/>

    <path d="M 68 -68 A 96 96 0 1 0 68 68"
          fill="none"
          stroke="url(#ringB)"
          stroke-width="20"
          stroke-linecap="round"/>

    <path d="M 64 -64 A 96 96 0 1 0 64 64"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0.9"/>

    <circle cx="0" cy="0" r="12" fill="#00F5D4" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#00F5D4"/>
  </g>

  <!-- Right Typography -->
  <text x="310" y="172"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, Arial, Helvetica, sans-serif"
        font-size="52"
        font-weight="900"
        letter-spacing="5"
        fill="#FFFFFF">CATHODE</text>

  <text x="314" y="218"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="20"
        font-weight="700"
        letter-spacing="8"
        fill="#00F5D4">BROWSER</text>
</svg>
