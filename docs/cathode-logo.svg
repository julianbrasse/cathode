<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="arcGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#2979FF" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="lineGradBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="960" height="540" fill="url(#bgBanner)" />

  <!-- CRT Tube Lens Background -->
  <g transform="translate(220, 270)">
    <circle cx="0" cy="0" r="160" fill="#07090E" stroke="#182238" stroke-width="2" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#2979FF" stroke-width="1" opacity="0.25" />

    <!-- Horizontal Scanline -->
    <line x1="-150" y1="0" x2="150" y2="0" stroke="url(#lineGradBanner)" stroke-width="2.5" opacity="0.85" filter="url(#glowBanner)" />

    <!-- Glow Arc -->
    <path d="M 84 -84 A 118 118 0 1 0 84 84"
          fill="none"
          stroke="#2979FF"
          stroke-width="30"
          stroke-linecap="round"
          opacity="0.35"
          filter="url(#glowBanner)" />

    <!-- Primary Arc -->
    <path d="M 84 -84 A 118 118 0 1 0 84 84"
          fill="none"
          stroke="url(#arcGradBanner)"
          stroke-width="20"
          stroke-linecap="round"
          filter="url(#glowBanner)" />

    <!-- Inner Core White Stroke -->
    <path d="M 84 -84 A 118 118 0 1 0 84 84"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="4.5"
          stroke-linecap="round"
          opacity="0.95" />

    <!-- Center Electron Beam Dot -->
    <circle cx="0" cy="0" r="18" fill="#00E5FF" opacity="0.2" filter="url(#glowBanner)" />
    <circle cx="0" cy="0" r="12" fill="#07090E" stroke="#00E5FF" stroke-width="3" filter="url(#glowBanner)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(450, 255)">
    <text x="0" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="76"
          font-weight="900"
          letter-spacing="10"
          fill="#FFFFFF">CATHODE</text>
    <text x="4" y="62"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="22"
          font-weight="700"
          letter-spacing="18"
          fill="#00E5FF">BROWSER</text>
  </g>
</svg>
